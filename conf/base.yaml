# Base config for the QA-Emb pipeline. Experiments in conf/exp/<group>/<ID>.yaml override
# one group each; CLI dotlist overrides (key=value) are applied last.
seed: 0
stage: all
tag: ""
dry_run: false

paths:
  out_root: outputs/qaemb        # content-addressed stage dirs: <out_root>/<stage>/<hash>/
  mlflow_uri: sqlite:///outputs/mlflow.db
  mlflow_artifacts: outputs/mlruns
  experiments_log: reports/experiments_log.md

data:
  name: test0_10class_100each
  root: "data/train_10class_100each"
  manifest: manifest.csv
  path_column: file
  id_column: isic_id
  image_ids: null                # optional explicit subset (list of ids)
  provenance:
    source: "ISIC Archive images; 10-class beta subset, 100 per class (train_10class_100each - beta)"
    preprocessing: "Supplied by a colleague; no transform documented. Files appear to be at native ISIC resolution (962x674 to 6721x4521 in the smoke set)."
    version: beta
    pipeline_transform: "Aspect-preserving resize to the answerer pixel budget (S1). No other edits."

label:
  column: label_2c
  positive: [malignant]
  negative: [benign]
  indeterminate_values: [""]     # raw values treated as indeterminate (empty = NaN in label_2c)
  # holdout: keep through answering/embedding with label -1; excluded from fitting and metrics, scored separately
  # drop: remove at S0 | benign / malignant: map to 0 / 1
  indeterminate: holdout

split:
  strategy: grouped              # grouped | loo
  group_column: lesion_id        # no patient ID available; lesion_id is the grouping proxy
  fractions: {train: 0.70, val: 0.15, test: 0.15}

questions:
  csv: "inputs/questions/2026-10-15/DermQs_Source-1015FT_Prompt-C_N-500_Negated.csv"
  annotations: "inputs/questions/2026-10-15/DermQs_Source-1015FT_Prompt-C_N-500_annotations.csv"  # scope/kind by Question ID
  id_column: question id         # matched case-insensitively
  text_column: question
  original_column: original      # 1 = question as written, 0 = negated complement (same Question ID)
  complements: true              # false = ask originals only
  scope: null                    # e.g. [local]; null = all
  ids: null                      # explicit subset of question IDs
  selected_from: null            # path to a W1 selected_questions.csv (Q2_selected)

prepare:
  max_pixels: 401408             # 512 vision tokens (28x28 px each) for the whole image
  patch_max_pixels: 401408       # crops are resized to this budget, so the VLM sees a zoom
  min_pixels: 3136
  upscale: true                  # true = fill max_pixels exactly (Qwen, multiples of 28); false = shrink only (Claude, I1_claude_max)
  max_long_edge: null            # shrink-only mode: also cap the long edge (px)
  format: png                    # png | jpg
  jpeg_quality: 95

grid:
  G: 1                           # 1 = whole image only
  overlap: 0.0                   # 0.5 = 50% overlap (stride = half a cell)
  include_whole: true            # patch runs also answer the whole image (patch_id -1)

answerer:
  backend: qwen_vl               # qwen_vl (local, P(yes) from logits) | anthropic (Claude API) | claude_cli (claude -p on the subscription); both: stated P(yes) + confidence
  id: qwen2.5-vl-7b
  checkpoint: Qwen/Qwen2.5-VL-7B-Instruct
  subfolder: null                # weights inside a repo subfolder (SkinGPT-R1: checkpoint)
  revision: main                 # resolved to a commit hash at run time
  answer_prefix: null            # text forced at the start of the answer, before Yes/No is read
  batched_prefix: null           # same for topic/all modes, before the JSON skeleton
  dtype: float16                 # Turing GPU: no native bf16
  attn: sdpa                     # sdpa | eager (eager needed for relevance maps)
  device: cuda
  yes_tokens: ["Yes", "yes", "YES"]
  no_tokens: ["No", "no", "NO"]

claude:                          # used when answerer.backend = anthropic
  model: claude-opus-5-5
  effort: low
  use_batch: true                # Message Batches API (half price, asynchronous); false = direct calls (pilots)
  max_tokens: {stateless: 2048, topic: 16000, all: 64000}
  concurrency: 8                 # direct calls only
  poll_seconds: 60
  max_attempts: 5                # resend incomplete requests; the stage fails if any is still incomplete
  budget:                        # API spend on this Console key, from the usage of every billed response (qaemb/answerers/claude.py)
    ledger: outputs/qaemb/claude_spend.csv   # one row per response; shared by all runs
    checkpoint_usd: 400          # stop before any submission projected to pass this, until approved_usd covers it
    limit_usd: 500               # never submit past this (also set as the spend limit in the Console)
    approved_usd: 0              # pass claude.budget.approved_usd=<amount> on the command line to continue past the checkpoint
    output_tokens_per_question: 30   # for the projection before a submission; replaced by the ledger's own mean once known
    output_tokens_per_prompt: 60
  prices:                        # USD per million tokens, list price (checked 2026-11-11); batches cost batch_factor of this
    claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.10, cache_write: 2.50}
    claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.20, cache_write: 5.00}
    batch_factor: 0.5

claude_cli:                      # used when answerer.backend = claude_cli (claude -p on the Claude subscription)
  binary: claude
  system_prompt: "Follow the user's instructions."   # replaces Claude Code's default; same for every call
  concurrency: 4
  timeout_s: 900
  stop_at: {five_hour: 0.9, seven_day: 0.75}       # pause when usage reaches these shares; leaves room for your own use

answer:
  replicate: 1                   # replicate number; part of the cache key only for non-deterministic answerers
  mode: stateless                # stateless | topic (one prompt per original x topic) | all (one prompt per original)
  shuffle: false                 # topic/all: shuffle question order inside each prompt (order-effect test)
  compute_batch: 32              # stateless: independent question sequences per forward pass
  shard_questions: 100           # checkpoint granularity within a unit
  threshold: 0.5                 # answer_bin = p_yes >= threshold (applied at S4)
  adj_threshold: 0.0             # answer_adj_bin = Net_P >= adj_threshold; also the bin threshold for dir/coh
  prompts:                       # template names in inputs/prompts/<name>.txt
    whole: stateless_whole_v1
    patch: stateless_patch_v1
    batched_whole: batched_whole_v1
    batched_patch: batched_patch_v1
    claude_whole: claude_stateless_whole_v1
    claude_batched_whole: claude_batched_whole_v1

feat:
  source: adj                    # adj (Net_P = P(yes|original) - P(yes|complement)) | w (P_w) | dir (Directional_Score) | coh (Coherence_Score) | orig | neg
  kind: prob                     # prob | bin (adj/dir/coh: score >= answer.adj_threshold; orig/neg: p_yes >= answer.threshold)

model:
  name: null                     # W0 | W1 | P0 | P1 | P2 | P3
  exclude_kinds: [artefact]      # audit features: dropped from the main classifier
  exclude_scopes: []
  sens_at_spec: 0.90
  ece_bins: 10
  cv_folds: 5
  Cs: [0.001, 0.01, 0.1, 1.0, 10.0]
  # W1
  l1_ratios: [0.1, 0.5, 0.9]
  stability_rounds: 50
  stability_threshold: 0.6
  # P models
  aggregator: mean               # mean | max | topk | noisyor | attention
  topk: 2
  position_specific: false       # P3
  epochs: 200
  lr: 0.01
  weight_decay: 0.01
  patience: 30

importance:                      # S7: which questions the S6 classifiers relied on (qaemb/stages/s7_importance.py)
  source: dir                    # feature source for the main tables and figures (dir = Directional Score)
  top_n: 20                      # questions listed per task
  per_class_top: 3               # marker questions per subtype (10-class model)
  redundancy_r: 0.7              # |correlation| from which two top questions count as near-duplicates

classify:                        # S6: cross-validated classifiers on the whole-image answers (qaemb/stages/s6_classify.py)
  label_columns: {c2: label_2c, c3: label_3c, c10: label_10c}   # read from the source manifest CSV
  sources: [orig, dir, coh]      # orig = P(yes); dir / coh = Directional / Coherence Score (see stages/s4_embed.py)
  models: [l1, l2, enet, rf, hgb, mlp]
  # s1_2c: benign vs malignant (indeterminate scored, not fitted); s1_3c: + indeterminate; flat_10c: all subtypes in one
  # model; s2_<group>: subtypes within one stage-1 class, true routing; the cascade (s1_3c -> s2_*) is computed from these
  tasks: [s1_2c, s1_3c, flat_10c, s2_benign, s2_malignant, s2_indeterminate]
  outer_folds: 5                 # stratified on label_10c, grouped by split.group_column
  outer_repeats: 5
  inner_folds: 3                 # hyperparameters chosen by log loss inside each outer training set
  shap_repeats: 1                # SHAP on the outer test folds of the first N repeats (each image explained once per repeat)
  shap_background: 50            # MLP only (permutation explainer)
  sens_target: 0.95              # report specificity at this malignant sensitivity
  n_jobs: -1
  synthetic: null                # {effect: <logit shift>} replaces the answers with simulated ones (qaemb/synthetic.py)

tune:                            # S8: penalty curves and selection rules for one linear model (qaemb/stages/s8_tune.py)
  model: l2                      # l2 (ridge) | l1 (lasso)
  sources: [dir, orig]           # feature sources (as in classify.sources)
  tasks: [s1_2c, flat_10c]       # tasks (as in classify.tasks)
  log10_C: [-5, 0]               # grid of C = 1/lambda: 1, 2, 3, 5 per decade from 10^-5 to 10^0, plus S6's own values
  check_classify: true           # read the S6 run of the same config and check this stage reproduces its choices
  n_jobs: -1

explore:                         # S9: unsupervised structure of the answers + interactive page (qaemb/stages/s9_explore.py)
  source: dir                    # score clustered (dir = Directional Score)
  kinds: [clinical, artefact]    # question kinds included (the control question is never clustered)
  metadata: data/train_10class_100each/isic_metadata.csv          # python -m qaemb.isic_metadata <manifest>
  text_questions: analysis/question_embeddings/2026-11-15_N500/questions.csv
  text_embeddings:               # analysis/question_embeddings/embed_question_set.py; the first is the main one
    qwen3: analysis/question_embeddings/2026-11-15_N500/emb_qwen3.npy
    panderm: analysis/question_embeddings/2026-11-15_N500/emb_panderm.npy
  question_ks: [5, 8, 10, 15, 20, 25, 30, 41, 50, 60]
  image_ks: [2, 3, 4, 5, 6, 8, 10, 12, 15, 20]
  default_question_k: 20
  default_image_k: 10
  min_institution_images: 10     # institutions with fewer images are pooled as "Other"
  n_perm: 1000                   # permutations for the cohesion and Mantel nulls
  n_perm_agreement: 200          # for the adjusted mutual information nulls
  n_perm_pca: 50                 # shuffles for parallel analysis
  thumb_px: 160
  case_images: null               # case-study images (ISIC ids); null = one typical melanoma and one naevus (pick_cases)
  n_jobs: 16

subtypes:                        # S11: 10-subtype detail and naevus against melanoma (qaemb/stages/s11_subtypes.py)
  pair: [benign melanocytic, malignant melanocytic]   # negative (naevus), positive (melanoma)
  between: [indeterminate melanocytic]                # never fitted; scored by every outer fit of the pair model
  n_boot: 2000                   # bootstrap resamples of patients, for intervals and paired differences

ridge:                           # S10: main model with leakage controls, trimmed question sets, final models (qaemb/stages/s10_ridge.py)
  source: dir
  tasks: [s1_2c, flat_10c]
  group_by: patient              # patient (ISIC patient_id where recorded, else lesion) | lesion (as in S6)
  dup_hamming: 12                # near-duplicate pictures (difference hash, of 256 bits) are put in one group
  feature_sets: [all, lasso27, lasso60, lasso120, top27, top60, reps27, reps60, pca27, pca60, rand27, rand60, rand120]
  n_random: 5                    # random draws for each randK
  compare_lesion_grouping: true  # also run 'all' with S6's grouping by lesion
  final_sets: [all, lasso27, lasso60, lasso120, reps27, reps60]
  final_cv_folds: 5
  log10_C: [-5, 0]               # lambda = 1/C from 1 to 100,000, four values per decade (S8)
  n_jobs: -1

vlmfeat:                         # S12: SkinGPT-R1 image embeddings and candidate-label diagnosis (qaemb/stages/s12_vlmfeat.py)
  id: skingpt-r1
  checkpoint: yuhos16/SkinGPT-R1
  subfolder: checkpoint
  revision: main
  dtype: float16                 # Turing GPU: no native bf16
  attn: sdpa
  device: cuda
  max_pixels: 1003520            # SkinGPT-R1's own evaluation bounds (its configs/evaluation.json)
  min_pixels: 3136
  prompt: skingpt_classification_v1          # SkinGPT-R1's prompts/classification_user.txt, unchanged
  # Reasoning skipped: the think block is closed empty and the answer opened in the format SkinGPT-R1 itself writes
  # ("<answer> Final Answer:Melanoma </answer>", smoke test 2026-11-16). With reasoning, greedy generation took 840 s
  # for 2 images on the Quadro RTX 8000, about 4-5 days for the 1,000 images.
  answer_prefix: "<think>\n\n</think>\n<answer> Final Answer:"
  label_suffix: " </answer>"
  layers: [0, 14, 21, 28]        # 0 = vision encoder output after the merger (at the image positions); 28 = last layer
  shard_images: 50
  orders: [forward, reversed]     # candidate list as given and reversed; the diagnosis averages the two (position bias)
  # Candidate labels, in the order shown to the model, with the subtype (classify.label_columns c10, short names) and
  # group each one counts towards. Chosen 2026-11-16 from the ISIC diagnoses (diagnosis_3) of the beta images, plus
  # seborrhoeic keratosis as the usual benign look-alike (no subtype: benign for the 2-class task, dropped for 10).
  candidates:
    - {label: Melanoma, subtype: malignant melanocytic, group: malignant}
    - {label: Basal cell carcinoma, subtype: malignant adnexal follicular, group: malignant}
    - {label: Squamous cell carcinoma, subtype: malignant epidermal, group: malignant}
    - {label: Actinic keratosis, subtype: indeterminate epidermal, group: indeterminate}
    - {label: Atypical melanocytic proliferation, subtype: indeterminate melanocytic, group: indeterminate}
    - {label: Melanocytic nevus, subtype: benign melanocytic, group: benign}
    - {label: Seborrheic keratosis, subtype: null, group: benign}
    - {label: Solar lentigo, subtype: flat melanotic pigmentation, group: benign}
    - {label: Dermatofibroma, subtype: benign fibro-histiocytic, group: benign}
    - {label: Fibroepithelial polyp, subtype: benign fibro-histiocytic, group: benign}
    - {label: Scar, subtype: benign fibro-histiocytic, group: benign}
    - {label: Hemangioma, subtype: benign vascular, group: benign}
    - {label: Angiokeratoma, subtype: benign vascular, group: benign}
    - {label: Pyogenic granuloma, subtype: benign vascular, group: benign}
    - {label: Verruca, subtype: inflammatory or infectious, group: benign}
    - {label: Dermatitis, subtype: inflammatory or infectious, group: benign}

bench:                           # S13: ridge on the questions against SkinGPT-R1, same outer folds as S10 (qaemb/stages/s13_bench.py)
  tasks: [s1_2c, flat_10c]
  # The first is the main embedding, fixed before any result: last layer, averaged over the image tokens (the image as
  # SkinGPT-R1's dermatology-tuned language model represents it, before reading the question). The rest are secondary.
  embeddings: [img_L28, img_L21, img_L14, img_L0, last_L28]
  log10_C: [-7, 0]               # lambda = 1/C from 1 to 10^7 (wider than S10: thousands of correlated columns)
  n_jobs: -1
